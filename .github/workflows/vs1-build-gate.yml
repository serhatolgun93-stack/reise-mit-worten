name: RMW VS1 Build Gate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmw-vs1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7
  FLUTTER_HOME: ${{ github.workspace }}/.flutter-sdk

jobs:
  analyze-test-android:
    name: Analyze, test, Android install build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "${FLUTTER_HOME}"
          echo "${FLUTTER_HOME}/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Static source preflight
        run: python3 scripts/static_preflight.py

      - name: QA catalog precheck
        run: python3 scripts/ci_release_gate_precheck.py

      - name: Bootstrap Android/iOS runners if missing
        run: bash scripts/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Android release install build
        run: flutter build apk --release

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -1 || true)
          if [[ -n "$APKSIGNER" ]]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "WARNING: apksigner not found; APK existence verified only."
          fi
          sha256sum "$APK" | tee qa/android_release_apk_sha256.txt

      - name: Upload Android install APK and QA inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmw-vs1-android-install
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            qa/*.json
            qa/*.md
            qa/*.txt
            qa/build_logs/**

  ios-debug-build:
    name: iOS unsigned debug build
    needs: analyze-test-android
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "${FLUTTER_HOME}"
          echo "${FLUTTER_HOME}/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Static source preflight
        run: python3 scripts/static_preflight.py

      - name: QA catalog precheck
        run: python3 scripts/ci_release_gate_precheck.py

      - name: Bootstrap Android/iOS runners if missing
        run: bash scripts/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: iOS unsigned debug build
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS build logs and QA inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmw-vs1-ios-qa
          if-no-files-found: warn
          path: |
            qa/*.json
            qa/*.md
            qa/build_logs/**
