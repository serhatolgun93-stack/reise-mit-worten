name: RMW VS1 Build Gate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rmw-vs1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7
  FLUTTER_HOME: ${{ github.workspace }}/.flutter-sdk

jobs:
  analyze-test-android:
    name: Analyze, test, Android install build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "${FLUTTER_HOME}"
          echo "${FLUTTER_HOME}/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Static source preflight
        run: python3 scripts/static_preflight.py

      - name: QA catalog precheck
        run: python3 scripts/ci_release_gate_precheck.py

      - name: Bootstrap Android/iOS runners if missing
        run: bash scripts/bootstrap_platforms.sh

      - name: Configure stable preview signing
        shell: bash
        env:
          RMW_PREVIEW_KEYSTORE_B64: ${{ secrets.RMW_PREVIEW_KEYSTORE_B64 }}
          RMW_PREVIEW_STORE_PASSWORD: ${{ secrets.RMW_PREVIEW_STORE_PASSWORD }}
          RMW_PREVIEW_KEY_ALIAS: ${{ secrets.RMW_PREVIEW_KEY_ALIAS }}
          RMW_PREVIEW_KEY_PASSWORD: ${{ secrets.RMW_PREVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RMW_PREVIEW_KEYSTORE_B64 RMW_PREVIEW_STORE_PASSWORD RMW_PREVIEW_KEY_ALIAS RMW_PREVIEW_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: required GitHub Actions secret '$name' is missing." >&2
              echo "Stable preview APKs are never allowed to fall back to a random runner debug key." >&2
              exit 3
            fi
          done
          printf '%s' "$RMW_PREVIEW_KEYSTORE_B64" | base64 --decode > android/app/rmw-preview.jks
          cat > android/key.properties <<EOF
          storePassword=$RMW_PREVIEW_STORE_PASSWORD
          keyPassword=$RMW_PREVIEW_KEY_PASSWORD
          keyAlias=$RMW_PREVIEW_KEY_ALIAS
          storeFile=rmw-preview.jks
          EOF
          chmod 600 android/app/rmw-preview.jks android/key.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Reise mit Worten app icon
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f assets/app_icon.png ]]; then
            dart run flutter_launcher_icons
          else
            echo "assets/app_icon.png not found; keeping current launcher icon for this build."
          fi

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Android universal release install build
        run: flutter build apk --release

      - name: Preserve universal APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/rmw-universal-release.apk

      - name: Android ARM64 release install build
        run: flutter build apk --release --target-platform android-arm64

      - name: Preserve ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/rmw-arm64-release.apk

      - name: Android package diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/build_logs
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT=$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1 || true)
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1 || true)
          : > qa/build_logs/android_install_diagnostics.txt
          for APK in build/app/outputs/flutter-apk/rmw-universal-release.apk build/app/outputs/flutter-apk/rmw-arm64-release.apk; do
            echo "===== $APK =====" | tee -a qa/build_logs/android_install_diagnostics.txt
            sha256sum "$APK" | tee -a qa/build_logs/android_install_diagnostics.txt
            if [[ -n "$AAPT" ]]; then
              "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" | tee -a qa/build_logs/android_install_diagnostics.txt
            fi
            if [[ -n "$APKSIGNER" ]]; then
              "$APKSIGNER" verify --verbose --print-certs "$APK" | tee -a qa/build_logs/android_install_diagnostics.txt
            fi
          done

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -1 || true)
          for APK in build/app/outputs/flutter-apk/rmw-universal-release.apk build/app/outputs/flutter-apk/rmw-arm64-release.apk; do
            test -f "$APK"
            if [[ -n "$APKSIGNER" ]]; then
              "$APKSIGNER" verify --verbose "$APK"
            fi
          done
          sha256sum build/app/outputs/flutter-apk/rmw-universal-release.apk build/app/outputs/flutter-apk/rmw-arm64-release.apk | tee qa/android_release_apk_sha256.txt

      - name: Upload Android install APKs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmw-vs1-android-install
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/rmw-universal-release.apk
            build/app/outputs/flutter-apk/rmw-arm64-release.apk
            qa/*.json
            qa/*.md
            qa/*.txt
            qa/build_logs/**

  ios-debug-build:
    name: iOS unsigned debug build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "${FLUTTER_HOME}"
          echo "${FLUTTER_HOME}/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Static source preflight
        run: python3 scripts/static_preflight.py

      - name: QA catalog precheck
        run: python3 scripts/ci_release_gate_precheck.py

      - name: Bootstrap Android/iOS runners if missing
        run: bash scripts/bootstrap_platforms.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Reise mit Worten app icon
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f assets/app_icon.png ]]; then
            dart run flutter_launcher_icons
          else
            echo "assets/app_icon.png not found; keeping current launcher icon for this build."
          fi

      - name: iOS unsigned debug build
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS build logs and QA inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmw-vs1-ios-qa
          if-no-files-found: warn
          path: |
            qa/*.json
            qa/*.md
            qa/build_logs/**
